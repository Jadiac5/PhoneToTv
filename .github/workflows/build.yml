name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Unit tests (protocol, planner, tuner, updater, loopback receiver server, simulated slow link),
      # then the debug APK and Android lint.
      - name: Test, build, lint
        run: ./gradlew testDebugUnitTest assembleDebug lintDebug --console=plain

      - name: Keep test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneStream-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
